plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.1.0'
group = 'com.fork.fnafmwpizzeria'

base {
    archivesName = 'fnafmwpizzeria'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.235'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        fnafmwpizzeria {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    // FNAFMW is not on a public Maven. Put these jars into libs/.
    implementation files('libs/fnafmw-alpha-1.0.0-snapshot-1.jar')
    implementation files('libs/refraction-neoforge-1.21.1-1.3.0-mw1.jar')
    implementation files('libs/vixis-0.7.0.jar')
    implementation files('libs/geckolib-neoforge-1.21.1-4.9.2.jar')
    implementation files('libs/veil-neoforge-1.21.1-4.5.2.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
